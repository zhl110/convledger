<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="再来一杯海星酒 (zhl110)">
<title>convledger · 架构与路线图 · 制作人 再来一杯海星酒</title>
<link rel="icon" type="image/svg+xml" href="/icon-small.svg">
<style>
  :root{
    --bg:#e9edf2; --panel:#ffffff; --panel2:#f2f5f9; --line:rgba(20,27,38,.10); --line2:rgba(20,27,38,.20);
    --fg:#141b26; --fg2:#41506a; --muted:#66788f; --accent:#0e7490; --accent-2:#0b5d75; --ok:#178a5e; --warn:#b45309; --bad:#c93b3b;
    --wire:rgba(14,116,144,.30);
    --lv0:#8a94a3; --lv1:#2f6f9f; --lv2:#178a5e; --lv3:#b45309;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI","DengXian","等线","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  header{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:650;letter-spacing:.2px;flex:none;white-space:nowrap}
  .brandmark{display:inline-block;width:20px;height:20px;margin-right:8px;vertical-align:-4px;background:var(--fg);-webkit-mask:url('/icon-small.svg') center/contain no-repeat;mask:url('/icon-small.svg') center/contain no-repeat}
  .brand span{color:var(--muted);font-weight:500;margin-left:8px;font-size:12.5px}
  .tabs{display:flex;gap:4px;margin-left:14px;flex:none}
  .tabs button{border:1px solid transparent;background:transparent;color:var(--fg2);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:var(--panel2);border-color:var(--line);color:var(--fg)}
  .grow{flex:1}
  .tools{display:flex;align-items:center;gap:6px}
  .tools button,.tools a{border:1px solid var(--line);background:var(--panel2);color:var(--fg2);height:28px;min-width:30px;padding:0 9px;border-radius:7px;font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .tools button:hover,.tools a:hover{border-color:var(--accent);color:var(--accent)}
  .search input{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--fg);font:inherit;width:220px}
  .search input:focus{outline:none;border-color:var(--accent)}
  main{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 52px)}
  #stage{position:relative;overflow:hidden;cursor:grab;background:
    radial-gradient(circle at 22% 18%, #f4f7fb 0, transparent 42%),
    radial-gradient(circle at 78% 82%, #eef2f7 0, transparent 45%), var(--bg)}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:1240px;height:1150px;transform-origin:0 0}
  /* 运行链路：先给一眼能读完的主干，再让人点进模块明细。 */
  .flow{position:absolute;inset:0;z-index:6;overflow:auto;padding:24px 26px 32px;background:
    radial-gradient(circle at 18% 10%, #f7fafc 0, transparent 42%),
    radial-gradient(circle at 88% 90%, #eef4f7 0, transparent 45%), var(--bg)}
  .flow[hidden]{display:none}
  .flowhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .flowhead span{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .flowhead b{font-size:21px;letter-spacing:-.02em;color:var(--fg)}
  .fpipe{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
  .fstage{flex:1 1 150px;min-width:142px;max-width:205px;text-align:left;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--fg);padding:13px 13px 12px;font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:border-color .15s,transform .15s,box-shadow .15s}
  .fstage:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 24px rgba(16,24,40,.08)}
  .fstage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fstage .fnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--panel2);color:var(--accent);font:11px/1 "Cascadia Mono",Consolas,monospace;margin-bottom:8px}
  .fstage b{display:block;font-size:15px;line-height:1.2}
  .fstage small{display:block;font-size:10.5px;line-height:1.35;color:var(--fg2);margin-top:5px}
  .fstage em{display:block;font-style:normal;font-size:10.5px;line-height:1.35;color:var(--muted);margin-top:7px}
  .farrow{display:flex;align-items:center;color:var(--accent);font-size:18px;padding:0 1px;flex:none}
  .fsupport{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
  .fsupport button{text-align:left;border:1px dashed var(--line2);border-radius:11px;background:rgba(255,255,255,.55);color:var(--fg);padding:11px 13px;font:inherit;cursor:pointer}
  .fsupport button:hover{border-color:var(--accent)}
  .fsupport b{display:block;font-size:12.5px}
  .fsupport small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .froles{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
  @media (max-width: 980px){ .fstage{max-width:none;flex-basis:calc(50% - 18px)} .farrow{display:none} }
  @media (max-width: 640px){ .fsupport{grid-template-columns:1fr} }
  #wires{position:absolute;left:0;top:0;width:1240px;height:1150px;overflow:visible;pointer-events:none}
  #wires path{fill:none;stroke:var(--wire);stroke-width:1.4;opacity:.9}
  #wires path.hot{stroke:var(--accent);opacity:1;stroke-width:2.2}
  /* 流线光点：每条连线叠一条虚线，按 dashoffset 朝箭头方向流动 */
  #wires path.flow{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 24;stroke-dashoffset:0;opacity:.5;animation:wireflow 1.7s linear infinite}
  #wires path.flow.hot{opacity:.95}
  @keyframes wireflow{to{stroke-dashoffset:-30}}
  .band{position:absolute;left:40px;right:40px;border:1px dashed var(--line2);border-radius:14px}
  .bandLabel{position:absolute;right:54px;text-align:right;font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .node{position:absolute;width:168px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--fg);text-align:left;font:inherit;cursor:pointer;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  /* 卡里的命令清单是 index/body/…/summarise 这种没有空格的长串：不强制断行就会顶穿卡片边框。 */
  .node .n,.node .s{overflow-wrap:anywhere}
  .node:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 24px rgba(16,24,40,.08)}
  .node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .node .k{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
  .node .n{display:block;font-weight:650;font-size:13.5px;margin-top:1px;line-height:1.25}
  .node .s{display:block;font-size:11px;color:var(--fg2);margin-top:3px;line-height:1.3}
  .node[data-layer="src"]{border-left:3px solid #5b93c4}
  .node[data-layer="derive"]{border-left:3px solid #46a98a}
  .node[data-layer="store"]{border-left:3px solid #c9a55a}
  .node[data-layer="table"]{border-left:3px solid #9b86c9}
  .node[data-layer="surface"]{border-left:3px solid #4fa3c0}
  .node[data-layer="loop"]{border-left:3px solid #cf8a8a}
  .node[data-layer="auto"]{border-left:3px solid var(--accent)}
  .node[data-layer="dump"]{border-left:3px solid #9aa6b4;background:var(--panel2)}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(14,116,144,.28)}
  .node.dim{opacity:.26}
  .node.hot{border-color:var(--accent)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px}
  aside h2{margin:0 0 2px;font-size:16px}
  .muted{color:var(--muted)}
  .chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg2);margin-right:6px;background:var(--panel2)}
  .sec{margin-top:16px;font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .kv{margin-top:6px;font-size:13px;color:var(--fg2);white-space:pre-wrap}
  code,.mono{font-family:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;font-size:12px;color:var(--accent-2)}
  .empty{color:var(--muted);margin-top:26px;line-height:1.7}
  .roadmap{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
  .roadmap[hidden]{display:none}
  .r3d{position:absolute;inset:0;background:
    radial-gradient(circle at 50% 38%, rgba(255,255,255,.92) 0, rgba(255,255,255,0) 48%),
    radial-gradient(circle at 18% 80%, #eef4f7 0, transparent 42%),
    radial-gradient(circle at 84% 18%, #f6f8fb 0, transparent 40%), var(--bg)}
  .r3d canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  .r3d canvas:active{cursor:grabbing}
  .r3dmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .r3dlabel{position:absolute;left:0;top:0;pointer-events:none;text-align:center;white-space:nowrap;transform:translate(-50%,-50%);color:var(--fg);text-shadow:0 1px 3px #fff,0 0 8px #fff}
  .r3dlabel b{display:block;font-size:11.5px;font-weight:650;letter-spacing:.01em}
  .r3dlabel small{display:block;font-size:9.5px;color:var(--fg2);margin-top:1px}
  @media (max-width:820px){ .r3dlabel small{display:none} }
  #tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--fg2);display:none;z-index:20;box-shadow:0 8px 24px rgba(16,24,40,.10)}
  @media (max-width: 980px){
    main{grid-template-columns:1fr} aside{display:none}
    .brand span,.search{display:none}
    header{padding:0 10px;gap:6px}
    .tabs{margin-left:6px}
    .tabs button{padding:6px 9px}
  }
  @media (prefers-reduced-motion: reduce){ #wires path.flow{animation:none;display:none} }
  /* App 内嵌：外层已有页头，但架构自己的三个视图 tab 必须留下。 */
  body.embed header{display:flex;height:44px;padding:0 12px;background:var(--panel2)}
  body.embed .brand,body.embed .tools,body.embed .grow{display:none}
  body.embed .tabs{margin-left:0}
  body.embed main{height:calc(100vh - 44px)}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');</script>
<header>
  <div class="brand"><i class="brandmark" aria-hidden="true"></i>convledger<span>架构与工作路线图</span></div>
  <div class="tabs" role="tablist" aria-label="视图">
    <button id="tabFlow" role="tab" aria-selected="true" aria-controls="stage">运行链路</button>
    <button id="tabArch" role="tab" aria-selected="false" aria-controls="stage">模块明细</button>
    <button id="tabRoad" role="tab" aria-selected="false" aria-controls="stage">工作路线图</button>
  </div>
  <div class="grow"></div>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="找模块 / 文件 / 命令" autocomplete="off" aria-label="搜索模块"></div>
    <button id="zin" title="放大">＋</button>
    <button id="zout" title="缩小">－</button>
    <button id="fit" title="适应窗口">适应</button>
    <a href="/" title="会话库">会话库</a>
  </div>
</header>

<main>
  <div id="stage">
    <div id="world">
      <svg id="wires" viewBox="0 0 1240 1150" aria-hidden="true">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8aa7b5"/></marker></defs>
      </svg>
      <section id="bands"></section>
      <section id="nodes"></section>
      <section id="road" class="roadmap" hidden>
        <div id="r3d" class="r3d"></div>
      </section>
    </div>
    <section id="flow" class="flow" aria-label="运行链路" hidden>
      <div class="flowhead"><span>运行链路</span><b>原文只读 → 结构账本 → 模型说明 → 读面 / 闭环</b></div>
      <div class="fpipe">
        <button class="fstage" data-node="qoder">
          <span class="fnum">01</span><b>宿主原文</b>
          <small>Qoder · Claude · WorkBuddy · OpenCode · Codex</small>
          <em>append-only · 只读</em>
        </button>
        <span class="farrow">→</span>
        <button class="fstage" data-node="adapter">
          <span class="fnum">02</span><b>适配 · 切段</b>
          <small>project.mjs · segment.mjs</small>
          <em>各宿主 → 同一份记录</em>
        </button>
        <span class="farrow">→</span>
        <button class="fstage" data-node="view">
          <span class="fnum">03</span><b>结构账本</b>
          <small>store.mjs · view.mjs</small>
          <em>段 → 块 → 步 + 锚点</em>
        </button>
        <span class="farrow">→</span>
        <button class="fstage" data-node="summaries">
          <span class="fnum">04</span><b>模型外挂表</b>
          <small>综述 · 阶段 · 章 · claims · 记忆</small>
          <em>模型写，工具验</em>
        </button>
        <span class="farrow">→</span>
        <button class="fstage" data-node="hub">
          <span class="fnum">05</span><b>读面</b>
          <small>hub · App · 画布 · CLI · hooks</small>
          <em>同一份账本，多种入口</em>
        </button>
        <span class="farrow">→</span>
        <button class="fstage" data-node="sync">
          <span class="fnum">06</span><b>项目闭环</b>
          <small>sync · progress · export</small>
          <em>任务 · 验收 · 记忆 · 导出</em>
        </button>
      </div>
      <div class="fsupport">
        <button data-node="archive"><b>逐字归档</b><small>source.jsonl · 源丢失才兜底</small></button>
        <button data-node="refresh"><b>后台 worker</b><small>refresh / closeout / usage · 不占前台</small></button>
        <button data-node="claims"><b>闸门</b><small>锚点 hash · revision · 六条判据</small></button>
      </div>
      <div class="froles">
        <span>工具 · 结构 / 锚点 / 闸门</span>
        <span>模型 · 综述 / 阶段 / 章 / 记忆</span>
        <span>人 · 档位 / 暂停 / 验收</span>
      </div>
    </section>
  </div>
  <aside id="insp" aria-live="polite">
    <div class="empty" id="inspEmpty">
      <b>先看运行链路，再点模块看职责。</b><br>
      运行链路是主干；「模块明细」是八层模块图。<br>
      点「工作路线图」切到 PM/PT 进度。<br><br>
      <span class="muted">切到「模块明细」后可拖空白平移、滚轮缩放；搜索会缩暗无关模块。</span>
    </div>
    <div id="inspBody" hidden></div>
  </aside>
</main>
<div id="tip"></div>

<script>
(function () {
  var NODES = [
    { id:'qoder', layer:'src', x:60, y:78, label:'Qoder JSONL', sub:'~/.qoder/projects', role:'第一个来源（append-only 原文）。工具只读它，正文永远回源到这里。', files:'<会话>.jsonl' },
    { id:'claude', layer:'src', x:260, y:78, label:'Claude Code JSONL', sub:'~/.claude/projects', role:'第二个来源的会话原文，与 Qoder 走同一套派生。', files:'<会话>.jsonl' },
    { id:'wb', layer:'src', x:460, y:78, label:'WorkBuddy 记录', sub:'~/.workbuddy', role:'第三个来源；经规范化视图接进来，报告里如实标注它是第三个来源。', files:'workbuddy.db / JSONL' },
    { id:'opencode', layer:'src', x:660, y:78, label:'OpenCode SQLite', sub:'~/.local/share/opencode', role:'第四个来源：SQLite 先投影成 append-only JSONL，再走同一套派生；Node <22.5 时跳过。', files:'opencode.db → out/opencode/' },
    { id:'codex', layer:'src', x:860, y:78, label:'Codex rollout', sub:'~/.codex/sessions', role:'第五个来源：rollout（深层嵌套＋信封记录）经 codex.mjs 投影成 out/codex 的规范 JSONL，再走同一套派生。助手/工具/压缩映射按格式写、本机未实测。', files:'~/.codex/sessions/**/rollout-*.jsonl → out/codex/' },
    { id:'archive', layer:'src', x:1060, y:78, label:'逐字归档', sub:'source.jsonl', role:'画布服务过的会话留一份逐字镜像；源被清掉后 body / anchors / 画布回落到它，并声明「读自归档」。', files:'out/store/<sid>/source.jsonl' },

    { id:'adapter', layer:'derive', x:60, y:212, label:'project.mjs', sub:'适配与规范化', role:'识别 runner，把三种记录形状规整成同一份视图；不做语义判断。', files:'tool/src/project.mjs' },
    { id:'segment', layer:'derive', x:300, y:212, label:'segment.mjs', sub:'切段规则', role:'按明写的规则把回合切成段并打标；每个决定都带规则号，零模型调用。', files:'tool/src/segment.mjs', cmd:'convledger show' },
    { id:'build', layer:'derive', x:540, y:212, label:'build.mjs', sub:'建账', role:'把段、压缩边界、工具调用、产物压成 ledger + facts；幂等，源一变重跑即可。', files:'tool/src/build.mjs', cmd:'convledger index <会话>' },
    { id:'facts', layer:'derive', x:780, y:212, label:'facts.mjs', sub:'结构账本', role:'回合/工具/压缩/成本的计数账本，页面上每个数都能在这里复算。', files:'tool/src/facts.mjs', cmd:'convledger facts --all' },
    { id:'hosttitles', layer:'derive', x:1020, y:212, label:'host-titles.mjs', sub:'宿主标题', role:'会话库标题优先读桌面端工作区里的会话名（只读宿主库、5 秒 TTL），读不到才回落到账本派生标题。', files:'tool/src/host-titles.mjs' },

    { id:'store', layer:'store', x:300, y:346, label:'store.mjs', sub:'账本读写 + 回源', role:'只存结构与锚点，不搬正文；body 按锚点现读，源没了对归档读并标 archived。', files:'out/store/<sid>/ledger.json', cmd:'convledger body S07' },
    { id:'view', layer:'store', x:540, y:346, label:'view.mjs', sub:'段→块→步→阶段', role:'唯一的派生层：块按压缩边界切、水位线后按真人提问切；地图和 steps 读同一份数。', files:'tool/src/view.mjs', cmd:'convledger steps --json' },

    { id:'claims', layer:'table', x:40, y:480, label:'claims.mjs', sub:'已证增量', role:'六条反编造判据全过才落盘，basis=verified；锚点一变自动失效。', files:'out/store/<sid>/claims.json', cmd:'convledger prove S07 → claim' },
    { id:'summaries', layer:'table', x:200, y:480, label:'summaries.mjs', sub:'块综述', role:'模型写五格、工具过四道闸门；卡面标题优先用它，没有就派生并标注。', files:'out/store/<sid>/summaries.json', cmd:'convledger digest --block N → summarise --put' },
    { id:'phases', layer:'table', x:360, y:480, label:'phases.mjs', sub:'阶段括号', role:'模型划连续步区间，工具核覆盖/锚点/引用；尾段只占位「阶段说明待写」。', files:'out/store/<sid>/phases.json', cmd:'convledger phases --put' },
    { id:'topics', layer:'table', x:520, y:480, label:'topics.mjs', sub:'话题/任务支', role:'话题名必须逐字出现在该段已证增量里才准挂；任务支从结构派生。', files:'out/store/<sid>/topics.json', cmd:'convledger label S04 --name 把手' },
    { id:'notes', layer:'table', x:680, y:480, label:'notes.mjs', sub:'人写标注/续做', role:'人写的标注 basis=human-note，永不参与判据；续做请求从画布底部写进账本。', files:'notes.jsonl / requests.jsonl', cmd:'convledger notes / requests' },

  var LAYERS = {
    src:    { name:'输入 · 五种宿主原文（Codex 走 rollout 投影）', y:20 },

    loop:   { name:'项目闭环 · 任务、提交、导出、记忆', y:702 },
    dump:   { name:'落盘 · 可重建的派生与权威副本', y:836 },

  };

  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var wires = document.getElementById('wires');
  var nodesEl = document.getElementById('nodes');
  var bandsEl = document.getElementById('bands');
  var roadEl = document.getElementById('road');
  var inspEmpty = document.getElementById('inspEmpty');
  var inspBody = document.getElementById('inspBody');
  var q = document.getElementById('q');
  var tip = document.getElementById('tip');
  var NS = 'http://www.w3.org/2000/svg';
  var cam = { x:0, y:0, z:1 };
  var sel = null, mode = 'flow';

  var byId = {};
  NODES.forEach(function (n) { byId[n.id] = n; });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  function build() {
    // 分层底纹与层名
    Object.keys(LAYERS).forEach(function (k) {
      var L = LAYERS[k];
      var b = el('div', 'band');
      b.style.top = (L.y - 14) + 'px';
      b.style.height = '124px';
      bandsEl.appendChild(b);
      var t = el('div', 'bandLabel', L.name);
      t.style.top = (L.y - 10) + 'px';
      bandsEl.appendChild(t);
    });

    NODES.forEach(function (n) {
      var b = el('button', 'node');
      b.type = 'button';
      b.dataset.id = n.id;
      b.dataset.layer = n.layer;
      b.style.left = n.x + 'px';
      b.style.top = n.y + 'px';
      b.appendChild(el('span', 'k', n.sub));
      b.appendChild(el('span', 'n', n.label));
      b.appendChild(el('span', 's', n.role.split('；')[0].replace(/。$/, '')));
      b.addEventListener('click', function () { select(n.id); });
      b.addEventListener('mouseenter', function (e) {
        tip.textContent = n.label + ' · ' + n.sub;
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top = (e.clientY + 12) + 'px';
      });
      b.addEventListener('mousemove', function (e) { tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; });
      b.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
      nodesEl.appendChild(b);
      n.el = b;
    });

    EDGES.forEach(function (pair) {
      var a = byId[pair[0]], b = byId[pair[1]];
      if (!a || !b) return;
      var x1 = a.x + 84, y1 = a.y + 62, x2 = b.x + 84, y2 = b.y;
      var dy = Math.max(24, Math.abs(y2 - y1) / 2);
      var d = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + (y1 + dy) + ' ' + x2 + ' ' + (y2 - dy) + ' ' + x2 + ' ' + y2;
      var p = svg('path', { d: d, 'marker-end': 'url(#ah)' });
      p.dataset.from = pair[0]; p.dataset.to = pair[1];
      wires.appendChild(p);
      // 叠一条流动光点：同一条线，虚线按 dashoffset 朝箭头方向流动
      var pf = svg('path', { d: d, 'class': 'flow' });
      pf.dataset.from = pair[0]; pf.dataset.to = pair[1];
      wires.appendChild(pf);
    });

    fit();
  }

  function focusSet(id) {
    var keep = {}; keep[id] = 1;
    EDGES.forEach(function (p) { if (p[0] === id) keep[p[1]] = 1; if (p[1] === id) keep[p[0]] = 1; });
    NODES.forEach(function (n) { n.el.classList.toggle('dim', !keep[n.id]); n.el.classList.toggle('hot', !!keep[n.id] && n.id !== id); });
    Array.prototype.forEach.call(wires.querySelectorAll('path'), function (p) {
      p.classList.toggle('hot', p.dataset.from === id || p.dataset.to === id);
    });
  }

  function clearFocus() {
    NODES.forEach(function (n) { n.el.classList.remove('dim', 'hot', 'sel'); });
    Array.prototype.forEach.call(wires.querySelectorAll('path'), function (p) { p.classList.remove('hot'); });
  }

  function select(id) {
    var n = byId[id]; if (!n) return;
    sel = id;
    clearFocus();
    n.el.classList.add('sel');
    focusSet(id);
    inspEmpty.hidden = true; inspBody.hidden = false;
    inspBody.textContent = '';
    var h = el('h2', '', n.label);
    inspBody.appendChild(h);
    var chips = el('div');
    chips.appendChild(el('span', 'chip', LAYERS[n.layer].name.split(' · ')[0]));
    chips.appendChild(el('span', 'chip', n.sub));
    inspBody.appendChild(chips);
    inspBody.appendChild(el('div', 'sec', '它负责什么'));
    inspBody.appendChild(el('div', 'kv', n.role));
    inspBody.appendChild(el('div', 'sec', '关键文件'));
    var f = el('div', 'kv'); f.appendChild(el('code', '', n.files)); inspBody.appendChild(f);
    if (n.cmd) { inspBody.appendChild(el('div', 'sec', '怎么用')); var c = el('div', 'kv'); c.appendChild(el('code', '', n.cmd)); inspBody.appendChild(c); }
    var outs = EDGES.filter(function (p) { return p[0] === id; }).map(function (p) { return byId[p[1]] ? byId[p[1]].label : p[1]; });
    var ins = EDGES.filter(function (p) { return p[1] === id; }).map(function (p) { return byId[p[0]] ? byId[p[0]].label : p[0]; });
    if (ins.length) { inspBody.appendChild(el('div', 'sec', '上游')); inspBody.appendChild(el('div', 'kv', ins.join('、'))); }
    if (outs.length) { inspBody.appendChild(el('div', 'sec', '去向')); inspBody.appendChild(el('div', 'kv', outs.join('、'))); }
  }

  function clearInsp() {
    sel = null; clearFocus();
    inspBody.hidden = true; inspEmpty.hidden = false;
  }

  // 缩放与平移
  function applyCam() {
    world.style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.z + ')';
    wires.style.strokeWidth = (1.2 / cam.z).toFixed(2);
  }
  function zoomAt(sx, sy, nz) {
    nz = Math.max(0.45, Math.min(1.8, nz));
    var wx = (sx - cam.x) / cam.z, wy = (sy - cam.y) / cam.z;
    cam.z = nz; cam.x = sx - wx * nz; cam.y = sy - wy * nz;
    applyCam();
  }
  function fit() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var z = Math.min(w / 1200, h / 1160, 1);
    cam.z = z; cam.x = (w - 1240 * z) / 2; cam.y = (h - 1150 * z) / 2;
    applyCam();
  }
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (mode !== 'arch') return;
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, cam.z * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.node, aside')) return;
    drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
    stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    cam.x = drag.cx + (e.clientX - drag.x); cam.y = drag.cy + (e.clientY - drag.y);
    applyCam();
  });
  stage.addEventListener('pointerup', function () { drag = null; stage.classList.remove('drag'); });
  document.getElementById('zin').addEventListener('click', function () { zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, cam.z * 1.2); });
  document.getElementById('zout').addEventListener('click', function () { zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, cam.z / 1.2); });
  document.getElementById('fit').addEventListener('click', fit);
  window.addEventListener('resize', function () { if (mode === 'arch') fit(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') clearInsp(); });
  document.addEventListener('mousemove', function (e) { if (tip.style.display === 'block' && e.target.closest('.node')) { tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; } });

  // 搜索
  q.addEventListener('input', function () {
    var t = q.value.trim().toLowerCase();
    if (!t) { clearFocus(); if (sel) select(sel); return; }
    NODES.forEach(function (n) {
      var hit = (n.label + ' ' + n.sub + ' ' + n.files + ' ' + (n.cmd || '') + ' ' + n.role).toLowerCase().indexOf(t) >= 0;
      n.el.classList.toggle('dim', !hit);
      n.el.classList.toggle('hot', hit);
    });
  });

  // 运行时路线：Three.js 三维管线；离开视图时停渲染，回来复用同一场景。
  var runtime3d = null, r3dLoading = false;

  function showRuntime3d() {
    if (runtime3d) { runtime3d.resize(); runtime3d.start(); return; }
    if (r3dLoading) return;
    r3dLoading = true;
    var host = document.getElementById('r3d');
    host.textContent = '三维路线载入中';
    import('/vendor/three.module.min.js?v=170').then(function (THREE) {
      runtime3d = makeRuntime3d(THREE, host);
      if (mode === 'road') runtime3d.start();
      r3dLoading = false;
    }).catch(function (e) {
      r3dLoading = false;
      host.textContent = '三维路线载入失败';
      try { console.error(e); } catch { /* 控制台不可用 */ }
    });
  }

  function makeRuntime3d(THREE, host) {
    host.textContent = '';
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 140);
    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xdce5ee, 1.35));
    var key = new THREE.DirectionalLight(0xffffff, 1.7);
    key.position.set(10, 18, 14); scene.add(key);
    var fill = new THREE.DirectionalLight(0xcfe6ff, 0.75);
    fill.position.set(-12, 8, -10); scene.add(fill);

    var grid = new THREE.GridHelper(46, 46, 0xd4dde7, 0xe8eef4);
    grid.position.y = -2.9;
    grid.material.transparent = true;
    grid.material.opacity = 0.55;
    scene.add(grid);

    var stages = [
      { id:'host',    title:'01 宿主会话', sub:'5 家宿主 · append-only',    color:0x5b93c4, p:[-8.8, 0.20, -0.5] },
      { id:'event',   title:'02 宿主事件', sub:'SessionStart · PreCompact · Stop', color:0x5b93c4, p:[-6.3, 0.38, 0.0] },
      { id:'source',  title:'03 源日志',   sub:'JSONL / SQLite · 只读',     color:0x178a5e, p:[-3.8, 0.55, 0.5] },
      { id:'adapter', title:'04 适配 · 切段', sub:'project · segment',      color:0x178a5e, p:[-1.3, 0.70, 0.7] },
      { id:'ledger',  title:'05 结构账本', sub:'段 → 块 → 步 + 锚点',       color:0x178a5e, p:[1.2, 0.80, 0.5] },
      { id:'model',   title:'06 模型外挂表', sub:'综述 · 阶段 · 章 · 记忆', color:0x9b86c9, p:[3.7, 0.72, 0.0] },
      { id:'read',    title:'07 读面',     sub:'CLI · hub · 画布 · App',    color:0x0e7490, p:[6.2, 0.55, -0.5] },
      { id:'loop',    title:'08 收尾闭环', sub:'closeout · sync · export',  color:0xb45309, p:[8.7, 0.35, -0.8] }
    ];
    var points = stages.map(function (s) { return new THREE.Vector3(s.p[0], s.p[1], s.p[2]); });
    var curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.18);
    var route = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 240, 0.035, 8, false),
      new THREE.MeshBasicMaterial({ color: 0x9fb2c6, transparent: true, opacity: 0.9 })
    );
    scene.add(route);

    var labelItems = [];
    function addLabel(title, sub, pos, offset) {
      var d = document.createElement('div');
      d.className = 'r3dlabel';
      var b = document.createElement('b'); b.textContent = title;
      var s = document.createElement('small'); s.textContent = sub;
      d.appendChild(b); d.appendChild(s); host.appendChild(d);
      labelItems.push({ el: d, pos: pos.clone(), off: offset });
      return d;
    }

    var sphereGeo = new THREE.SphereGeometry(0.36, 24, 24);
    var ringGeo = new THREE.TorusGeometry(0.60, 0.026, 8, 48);
    stages.forEach(function (s, i) {
      var pos = points[i];
      var mesh = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({
        color: s.color, emissive: s.color, emissiveIntensity: 0.38, metalness: 0.12, roughness: 0.32
      }));
      mesh.position.copy(pos); scene.add(mesh);
      var ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.55 }));
      ring.position.copy(pos); ring.rotation.x = Math.PI / 2; scene.add(ring);
      addLabel(s.title, s.sub, pos, i % 2 ? 44 : -44);
    });

    function dashed(from, to, color) {
      var g = new THREE.BufferGeometry().setFromPoints([from, to]);
      var line = new THREE.Line(g, new THREE.LineDashedMaterial({ color: color, dashSize: 0.28, gapSize: 0.22, transparent: true, opacity: 0.75 }));
      line.computeLineDistances(); scene.add(line);
    }

    var sideGeo = new THREE.SphereGeometry(0.20, 18, 18);
    function side(pos, title, sub, color, from) {
      var m = new THREE.Mesh(sideGeo, new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.25, roughness: 0.4 }));
      m.position.copy(pos); scene.add(m);
      dashed(from, pos, color);
      addLabel(title, sub, pos, 40);
    }
    side(new THREE.Vector3(-3.8, -1.7, 1.7), 'source.jsonl', '源丢失兜底', 0x8a94a3, points[2]);
    side(new THREE.Vector3(6.2, -1.7, 0.4), 'refresh worker', '后台重算 · 缓存', 0x0e7490, points[6]);

    var briefPts = [
      points[6].clone(),
      new THREE.Vector3(6.4, 3.2, 0.5),
      new THREE.Vector3(3.5, 4.1, 0.8),
      new THREE.Vector3(-3.0, 3.8, 0.5),
      points[0].clone()
    ];
    var briefCurve = new THREE.CatmullRomCurve3(briefPts, false, 'catmullrom', 0.25);
    var briefLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(briefCurve.getPoints(140)),
      new THREE.LineDashedMaterial({ color: 0x0e7490, dashSize: 0.26, gapSize: 0.2, transparent: true, opacity: 0.8 })
    );
    briefLine.computeLineDistances(); scene.add(briefLine);
    addLabel('brief 注入', '下一轮上下文', new THREE.Vector3(0, 4.25, 0.8), -16);

    var dots = [];
    var dotGeo = new THREE.SphereGeometry(0.085, 10, 10);
    var dotMat = new THREE.MeshBasicMaterial({ color: 0x0e7490 });
    for (var i = 0; i < 7; i++) {
      var d = new THREE.Mesh(dotGeo, dotMat); scene.add(d); dots.push(d);
    }
    var briefDot = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 10), new THREE.MeshBasicMaterial({ color: 0x0e7490 }));
    scene.add(briefDot);

    var target = new THREE.Vector3(0, 0.7, 0);
    var sph = { r: 23, theta: 0.02, phi: 1.12 };
    var auto = true, dragging = false, lastX = 0, lastY = 0, running = false;

    function updateLabels() {
      var w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      var v = new THREE.Vector3();
      labelItems.forEach(function (it) {
        v.copy(it.pos).project(camera);
        var visible = v.z < 1 && v.z > -1;
        var x = Math.max(34, Math.min(w - 34, (v.x * 0.5 + 0.5) * w));
        var y = Math.max(16, Math.min(h - 16, (-v.y * 0.5 + 0.5) * h + it.off));
        it.el.style.transform = 'translate(-50%,-50%) translate(' + x + 'px,' + y + 'px)';
        it.el.style.opacity = visible ? 1 : 0;
      });
    }

    function placeCamera() {
      camera.position.set(
        target.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
        target.y + sph.r * Math.cos(sph.phi),
        target.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
      );
      camera.lookAt(target);
      updateLabels();
    }
    placeCamera();

    function resize() {
      var w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      updateLabels();
    }
    renderer.domElement.addEventListener('pointerdown', function (e) {
      dragging = true; auto = false; lastX = e.clientX; lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      sph.theta -= (e.clientX - lastX) * 0.006;
      sph.phi = Math.max(0.42, Math.min(1.42, sph.phi - (e.clientY - lastY) * 0.006));
      lastX = e.clientX; lastY = e.clientY; placeCamera();
    });
    renderer.domElement.addEventListener('pointerup', function () { dragging = false; });
    renderer.domElement.addEventListener('wheel', function (e) {
      e.preventDefault();
      sph.r = Math.max(14, Math.min(40, sph.r + e.deltaY * 0.015));
      placeCamera();
    }, { passive: false });
    if (window.ResizeObserver) new ResizeObserver(resize).observe(host); else window.addEventListener('resize', resize);

    function loop(t) {
      if (auto) { sph.theta += 0.0009; placeCamera(); }
      var k = (t || 0) * 0.00007;
      dots.forEach(function (d, i) { d.position.copy(curve.getPointAt((k + i / dots.length) % 1)); });
      briefDot.position.copy(briefCurve.getPointAt(k * 1.4 % 1));
      renderer.render(scene, camera);
      updateLabels();
    }
    return {
      start: function () { if (running) return; running = true; resize(); placeCamera(); renderer.setAnimationLoop(loop); },
      stop: function () { if (!running) return; running = false; renderer.setAnimationLoop(null); },
      resize: resize
    };
  }

  // 视图切换：默认先看运行链路，模块明细保留原八层图。
  var tabFlow = document.getElementById('tabFlow'), tabArch = document.getElementById('tabArch'), tabRoad = document.getElementById('tabRoad');
  var flowEl = document.getElementById('flow');
  function setMode(m) {
    mode = m;
    var flow = m === 'flow', arch = m === 'arch', road = m === 'road';
    tabFlow.setAttribute('aria-selected', String(flow));
    tabArch.setAttribute('aria-selected', String(arch));
    tabRoad.setAttribute('aria-selected', String(road));
    flowEl.hidden = !flow;
    world.style.display = flow ? 'none' : '';
    ['bands', 'nodes', 'wires'].forEach(function (id) { document.getElementById(id).style.display = arch ? '' : 'none'; });
    roadEl.hidden = !road;
    stage.style.cursor = flow ? 'default' : '';
    if (arch) { world.style.transform = ''; world.style.width = '1240px'; world.style.height = '1150px'; fit(); }
    else if (road) {
      world.style.transform = 'none'; world.style.width = stage.clientWidth + 'px'; world.style.height = stage.clientHeight + 'px';
      roadEl.style.width = '100%';
      showRuntime3d();
    }
    else if (runtime3d) runtime3d.stop();
    clearInsp();
  }
  tabFlow.addEventListener('click', function () { setMode('flow'); });
  tabArch.addEventListener('click', function () { setMode('arch'); });
  tabRoad.addEventListener('click', function () { setMode('road'); });
  flowEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-node]');
    if (!b) return;
    setMode('arch');
    select(b.dataset.node);
  });
  q.addEventListener('input', function () {
    if (mode === 'flow' && q.value.trim()) setMode('arch');
  });

  build();
  setMode('flow');
})();
</script>
</body>
</html>
